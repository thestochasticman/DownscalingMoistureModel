[project]
name = "emt"
version = "0.1.0"
description = "Downscaling SMIPS ~1 km soil moisture to ~30 m topographic resolution, trained and validated against the OzNet Murrumbidgee in-situ network."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "rioxarray",
    "geopandas",
    "scikit-learn",
    "requests",
    "xlrd",          # legacy .xls reader for OzNet files
    "pysheds",       # flow accumulation / TWI
    "rasterio",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emt*"]
