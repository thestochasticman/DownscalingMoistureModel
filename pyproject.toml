[project]
name = "emt"
version = "0.1.0"
description = "Downscaling SMIPS ~1 km soil moisture to ~30 m topographic resolution, trained and validated against the OzNet Murrumbidgee in-situ network."
requires-python = ">=3.11"
# EMT runs inside the PaddockTS environment and imports PaddockTS directly for
# all SMIPS / terrain downloads (see emt.queries / emt.covariates). Install
# PaddockTS (the parallel paddock-ts-local repo) editable into the same env;
# it provides numpy/pandas/xarray/rioxarray/geopandas/rasterio/pysheds/etc.
# Listed below are only the extras EMT adds on top.
dependencies = [
    "scikit-learn",  # the downscaling regression model
    "xlrd",          # legacy .xls reader for OzNet in-situ files
    "scipy",         # model7 bucket-parameter calibration (Nelder-Mead)
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emt*"]
